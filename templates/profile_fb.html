{% extends "base.html" %}

{% block TITLE %}
Fundbüro Dashboard
{% endblock %}

{% block CONTENT %}

<div class="mb-4">
    <h4><i class="bi bi-building"></i> {{ fundbuero.name }}</h4>
    <p class="text-muted mb-0">Campus {{ fundbuero.campus_id }}</p>
    <p class="text-muted mb-0">{{ fundbuero.raum }}</p>
    <p class="text-muted">Telefon: {{ fundbuero.telefonnummer }}</p>
</div>
<a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm mb-4">
    <i class="bi bi-box-arrow-right"></i> Ausloggen
</a>

<h5 class="mb-3">Zugeordnete Fundsachen</h5>

{% endblock %}
