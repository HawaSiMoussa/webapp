{% extends "base.html" %}

{% block TITLE %}
Profil
{% endblock %}



{% block CONTENT %}



<h2 class="mb-4">
    <i class="bi bi-person-circle"></i>
    Profil
</h2>

<div class="border rounded p-4">

    <div class="row mb-3">
        <div class="col-4">
            <strong>Benutzername</strong>
        </div>

        <div class="col">
            {{ user.benutzername }}
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-4">
            <strong>Name</strong>
        </div>

        <div class="col">
            {{ user.name }}
            <a href="{{ url_for('edit_profile') }}">
            <i class="bi bi-pencil ms-2"></i>
            </a>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-4">
            <strong>Mail</strong>
        </div>

        <div class="col">
            {{ user.hwr_mail }}
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-4">
            <strong>Telefonnummer</strong>
        </div>

        <div class="col">
            {{ user.telefonnummer }}

            <a href="{{ url_for('edit_profile') }}">
            <i class="bi bi-pencil ms-2"></i>
            </a>
        </div>
    </div>

    <div class="row">
        <div class="col-4">
            <strong>Campus</strong>
        </div>

        <div class="col">
            {{ user.campus_id }}

            <a href="{{ url_for('edit_profile') }}">
            <i class="bi bi-pencil ms-2"></i>
            </a>
        </div>
    </div>

</div>

{% endblock %}
