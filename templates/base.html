<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block TITLE %}{% endblock %}
    </title>

    {{ bootstrap.load_css() }}
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

   <link rel="stylesheet"
      href="{{ url_for('static', filename='css/color.css') }}">
</head>

<body>
<div class="container-fluid"></div>
<!-- Navbar bzw collapse menü -->
<!-- Menüinhalt -->
<nav class="navbar border-bottom mb-3">

    <div class="container-fluid">

        <a class="navbar-brand" href="{{ url_for('home') }}">
            LostAndFound
        </a>

        <button
            class="btn btn-outline-secondary"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggleExternalContent">

            <i class="bi bi-list"></i>

        </button>

    </div>

</nav>

<div class="d-flex justify-content-end">

    <div class="collapse" id="navbarToggleExternalContent">

        <div class="border rounded p-3" style="width:300px;">
            <a href="{{ url_for('home') }}" class="d-block mb-2">
                <i class="bi bi-house"></i> Home
            </a>

            <a href="{{ url_for('profile') }}" class="d-block mb-2">
                <i class="bi bi-person"></i> Profil
            </a>

            <a href="{{ url_for('create_post') }}" class="d-block mb-2">
                <i class="bi bi-plus-lg"></i> Post erstellen
            </a>

            <a href="{{ url_for('contact') }}" class="d-block">
                <i class="bi bi-exclamation-circle"></i> Hilfe & Kontakt
            </a>

        </div>

    </div>

</div>

<div class="container mt-3">

    
<!--flask sucht Bilder und andere statische Dateien automatisch im static folder deswegen static-->
    {% block CONTENT %}
    {% endblock %}

</div>

{{ bootstrap.load_js() }}

</body>
</html>
