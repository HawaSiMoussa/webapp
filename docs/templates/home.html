<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>LostAndFound</title>

    {{ bootstrap.load_css() }}

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="container mt-4">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light rounded shadow-sm mb-4">

        <div class="container-fluid">

            <span class="navbar-brand fw-bold">
                LostAndFound
            </span>

            <button class="btn btn-outline-secondary">
                <i class="bi bi-list"></i>
            </button>

        </div>
        

    </nav>


    <!-- Post -->
    {% for post in posts %}
    <div class="card shadow-sm">

        <div class="card-body">

            <!-- Username -->
            <strong>
    <i class="bi bi-person-circle"></i>
    {{ post.username }}
</strong>

            <!-- Titel -->
            <h3 class="mt-3">
                {{ post.title }}
            </h3>

            <!-- Buttons + Status -->
            <div class="mt-3 d-flex align-items-center gap-2">

                <!-- Beschreibung öffnen -->
                <button
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#details1">

                    <i class="bi bi-three-dots"></i>

                </button>

                <!-- Nachricht -->
                <button
                    class="btn btn-outline-primary btn-sm">

                    <i class="bi bi-envelope"></i>

                </button>

                <!-- Views -->
                <span>

                    <i class="bi bi-eye"></i>
                    {{ post.views }}

                </span>

                <!-- Statuspunkt -->

                <span
                    class="rounded-circle bg-danger d-inline-block"
                    style="width:6px; height:6px;">
                </span>

            </div>

            <!-- Aufklappbarer Bereich -->
            <div class="collapse mt-3" id="details1">

                <div class="card card-body">

                    <p>
                        <strong>Beschreibung:</strong><br>
                        {{ post.description }}
                    </p>

                    <p>
                        <strong>Verlustort:</strong><br>
                        {{ post.LocationOfLoss }}
                    </p>

                    <p>
                        <strong>Verlustdatum:</strong><br>
                        {{ post.DateOfLoss }})
                    </p>

                    <button
                        class="btn btn-outline-secondary btn-sm w-auto"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#details1">

                        <i class="bi bi-chevron-up"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

{% endfor %}
</div>

{{ bootstrap.load_js() }}

</body>

</html>
